[app]
name = "overleaf"
version = "0.1.0"
description = "Overleaf Community Edition (online LaTeX editor) packaged for Cloud in a Bottle.  Bundles MongoDB + Redis in-container; the Cloud in a Bottle zone owner is auto-signed-in to the Overleaf admin via an auth-proxy that mints an Overleaf session against the bootstrap-generated admin credentials."
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
# auth-proxy port.  Overleaf web (Node) runs on 127.0.0.1:80
# inside the container; the upstream image's clsi-nginx listens
# on 127.0.0.1:8080 (output-file routing for the LaTeX
# compiler), so our auth-proxy uses 8090 to avoid the clash.
port = 8090

[routing]
# Static /_healthz served by the auth-proxy returns 200 as soon
# as the proxy is up, well before Overleaf's first-boot Mongo +
# nginx + Node services are ready (can take 60+s).
health_check = "/_healthz"
# Treat every Overleaf URL as public so the owner can share a
# project link with collaborators who don't have OpenHost zone
# accounts.  Access control inside the app is enforced by
# Overleaf itself: project sharing is link-token-gated, and
# logged-out visitors land on Overleaf's own /login page rather
# than OpenHost's owner-only login.
#
# The owner is still auto-logged-in via the auth-proxy because
# the OpenHost router stamps ``X-OpenHost-Is-Owner: true`` on
# their requests; the auth-proxy gates auto-login on that
# header, not on path, so no risk of accidentally granting
# admin sessions to visitors.
#
# Project sharing flow for a non-owner:
#   1. Owner shares a project (Share button → invite by email
#      OR copy a link-share URL).
#   2. Collaborator opens the URL.  No zone_auth → OpenHost
#      router lets them through (paths are all public).
#   3a. (Anonymous link share) The visitor is granted access
#       directly by Overleaf's TokenAccess endpoint without
#       needing an Overleaf account at all.  Requires
#       OVERLEAF_ALLOW_ANONYMOUS_READ_AND_WRITE_SHARING=true
#       (set in start.sh).
#   3b. (Email invite) The visitor lands on Overleaf's /login.
#       If they don't have an account yet, the owner creates
#       one for them via /admin/register (Overleaf CE has no
#       open self-signup — the public /register page is just a
#       static "contact admin" notice).
#   4. They join the project as a normal Overleaf user (3b) or
#      as an anonymous collaborator scoped to that one project
#      (3a).
public_paths = ["/"]

[resources]
# Overleaf bundles MongoDB + Redis + multiple Node services
# (web, clsi, document-updater, real-time, contacts, etc.).
# 2 GiB is a sensible minimum; bump higher if you compile big
# documents.  CLSI / latex compilation is also CPU-heavy.
memory_mb = 2048
cpu_millicores = 2000

[data]
# Persistent state under /data/app_data/overleaf/:
#   * data/      — Overleaf's /var/lib/overleaf bind mount
#                  (uploads, compiles, mongo db file, redis dump)
#   * admin-credentials.txt — generated admin email + password
#                  (mode 0600) for the auth-proxy.
app_data = true
app_temp_data = true
