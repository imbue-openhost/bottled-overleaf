[app]
name = "overleaf"
version = "0.1.0"
description = "Overleaf Community Edition (online LaTeX editor) packaged for OpenHost.  Bundles MongoDB + Redis in-container; the OpenHost zone owner is auto-signed-in to the Overleaf admin via an auth-proxy that mints an Overleaf session against the bootstrap-generated admin credentials."
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
# auth-proxy port.  Overleaf web (Node) runs on 127.0.0.1:80
# inside the container; the proxy listens on 8080 and is what
# the OpenHost router forwards to.
port = 8080

[routing]
# Static /_healthz served by the auth-proxy returns 200 as soon
# as the proxy is up, well before Overleaf's first-boot Mongo +
# nginx + Node services are ready (can take 60+s).
health_check = "/_healthz"
public_paths = [
    "/_healthz",
    # Overleaf's REST API surface.  Used by the editor UI and by
    # third-party tools (Git integration, Zotero, etc.).
    "/api/",
    # Login form.  The auth-proxy POSTs to this from the
    # auto-login dance; we want it reachable without zone_auth so
    # the OpenHost router doesn't preempt our internal POST.
    "/login",
    # Password reset / set links generated by the create-user
    # bootstrap step.  Owner-only via the email-token URL.
    "/user/password/",
    # Static assets (JS / CSS / fonts).
    "/stylesheets/",
    "/javascripts/",
    "/fonts/",
    "/img/",
    "/assets/",
    "/favicon.ico",
    "/socket.io/",
]

[resources]
# Overleaf bundles MongoDB + Redis + multiple Node services
# (web, clsi, document-updater, real-time, contacts, etc.).
# 2 GiB is a sensible minimum; bump higher if you compile big
# documents.  CLSI / latex compilation is also CPU-heavy.
memory_mb = 2048
cpu_millicores = 2000

[data]
# Persistent state under /data/app_data/overleaf/:
#   * data/      — Overleaf's /var/lib/overleaf bind mount
#                  (uploads, compiles, mongo db file, redis dump)
#   * admin-credentials.txt — generated admin email + password
#                  (mode 0600) for the auth-proxy.
app_data = true
app_temp_data = true
